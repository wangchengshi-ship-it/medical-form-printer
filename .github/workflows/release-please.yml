name: Release Please

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # Node.js package release type
          release-type: node
          # Create GitHub releases when PR is merged
          # This will trigger the publish.yml workflow
