# Codecov configuration
# https://docs.codecov.com/docs/codecov-yaml

coverage:
  precision: 2
  round: down
  range: "60...100"
  status:
    project:
      default:
        target: auto
        threshold: 5%
    patch:
      default:
        target: auto
        threshold: 5%

parsers:
  gcov:
    branch_detection:
      conditional: yes
      loop: yes
      method: no
      macro: no

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false

ignore:
  - "node_modules/**"
  - "dist/**"
  - "stories/**"
  - "**/*.stories.ts"
  - "**/*.test.ts"
  - ".storybook/**"
  - "storybook-static/**"
  - "coverage/**"
  - "scripts/**"
  - "*.config.*"
